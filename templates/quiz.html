<!doctype html><html><head><title>Quiz</title><link rel="stylesheet" href="/static/css/style.css"></head>
<body><nav><b>🧠 Smart Quiz</b><span>⏱️ <span id="timer">05:00</span></span></nav>
<div class="container"><form method="post" action="/submit_quiz" id="quizForm"><input type="hidden" name="subject" value="{{subject}}"><input type="hidden" name="topic" value="{{topic}}"><input type="hidden" name="question_ids" value="{% for q in questions %}{{q.id}}{% if not loop.last %},{% endif %}{% endfor %}">
<h1>{{subject}} Quiz</h1>{% for q in questions %}<div class="card"><h3>Q{{loop.index}}. {{q.question}}</h3>
<label><input type="radio" name="q_{{q.id}}" value="A" required> A. {{q.option_a}}</label>
<label><input type="radio" name="q_{{q.id}}" value="B"> B. {{q.option_b}}</label>
<label><input type="radio" name="q_{{q.id}}" value="C"> C. {{q.option_c}}</label>
<label><input type="radio" name="q_{{q.id}}" value="D"> D. {{q.option_d}}</label></div>{% endfor %}
<button>Submit Quiz</button></form></div><script src="/static/js/script.js"></script></body></html>
